(function () {
    var sidebar = document.getElementById('sidebar');
    var mainEl = document.getElementById('main-content');
    var toggleBtn = document.getElementById('sidebar-toggle');
    var toggleIcon = document.getElementById('sidebar-toggle-icon');
    var resizeHandle = document.getElementById('sidebar-resize-handle');

    var COLLAPSED_KEY = 'flare-sidebar-collapsed';
    var WIDTH_KEY = 'flare-sidebar-width';
    var DEFAULT_WIDTH = 200;
    var MIN_WIDTH = 64;
    var MAX_WIDTH = 240;
    var ICON_ONLY_THRESHOLD = 100;

    var savedWidth = parseInt(localStorage.getItem(WIDTH_KEY), 10);
    var currentWidth = (savedWidth >= MIN_WIDTH && savedWidth <= MAX_WIDTH) ? savedWidth : DEFAULT_WIDTH;
    var collapsed = localStorage.getItem(COLLAPSED_KEY) === '1';

    function isDesktop() {
        return window.matchMedia('(min-width: 768px)').matches;
    }

    function applyIconOnly(iconOnly) {
        var labels = sidebar.querySelectorAll('.nav-label, .sidebar-brand-label, .sidebar-profile-label');
        labels.forEach(function (el) { el.style.display = iconOnly ? 'none' : ''; });

        // Every row (brand, nav list, nav links, account row) has a different
        // horizontal padding by default, so centering each independently
        // leaves their icons at different x positions. Zeroing all of them
        // out and centering within the full-width rail makes every icon —
        // logo included — line up on the same vertical axis.
        var rows = sidebar.querySelectorAll('.nav-link, #account-menu-trigger, .sidebar-brand-row, .sidebar-nav-list, .sidebar-footer-wrap');
        rows.forEach(function (el) {
            el.style.justifyContent = iconOnly ? 'center' : '';
            el.style.paddingLeft = iconOnly ? '0px' : '';
            el.style.paddingRight = iconOnly ? '0px' : '';
        });

        // Push the brand row down a bit so it doesn't crowd the top edge
        // of the rail once it's icon-only.
        var brandRow = sidebar.querySelector('.sidebar-brand-row');
        if (brandRow) {
            brandRow.style.marginTop = iconOnly ? '12px' : '';
        }

        // The brand logo is sized for a wide sidebar (64px) — at the
        // minimum rail width (64px) it would overflow its own row edge to
        // edge. Shrink it to 1.5x the 20px nav icons (30px) so it fits
        // with breathing room while still reading as a "brand mark"
        // rather than just another nav icon, instead of getting clipped
        // by the rail's overflow:hidden.
        var logoImg = sidebar.querySelector('.sidebar-logo-img');
        if (logoImg) {
            logoImg.style.width = iconOnly ? '30px' : '';
            logoImg.style.height = iconOnly ? '30px' : '';
        }
    }

    function render() {
        var width = collapsed ? 0 : currentWidth;
        sidebar.style.width = width + 'px';
        sidebar.style.opacity = collapsed ? '0' : '1';
        sidebar.style.borderRightWidth = collapsed ? '0px' : '1.5px';
        mainEl.style.marginLeft = (isDesktop() && !collapsed) ? currentWidth + 'px' : '0px';
        toggleIcon.textContent = collapsed ? 'left_panel_open' : 'left_panel_close';
        applyIconOnly(!collapsed && currentWidth <= ICON_ONLY_THRESHOLD);
    }

    function setCollapsed(value) {
        collapsed = value;
        localStorage.setItem(COLLAPSED_KEY, collapsed ? '1' : '0');
        render();
    }

    function setWidth(px) {
        currentWidth = Math.max(MIN_WIDTH, Math.min(MAX_WIDTH, px));
        localStorage.setItem(WIDTH_KEY, String(currentWidth));
        render();
    }

    toggleBtn.addEventListener('click', function () { setCollapsed(!collapsed); });
    window.addEventListener('resize', render);

    if (resizeHandle) {
        var dragging = false;
        var startX = 0;
        var startWidth = 0;

        resizeHandle.addEventListener('mouseover', function () {
            resizeHandle.style.background = 'rgba(13,159,110,0.3)';
        });
        resizeHandle.addEventListener('mouseout', function () {
            if (!dragging) resizeHandle.style.background = 'transparent';
        });

        resizeHandle.addEventListener('mousedown', function (e) {
            if (collapsed) return;
            dragging = true;
            startX = e.clientX;
            startWidth = currentWidth;
            sidebar.style.transition = 'none';
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
            e.preventDefault();
        });

        document.addEventListener('mousemove', function (e) {
            if (!dragging) return;
            setWidth(startWidth + (e.clientX - startX));
        });

        document.addEventListener('mouseup', function () {
            if (!dragging) return;
            dragging = false;
            sidebar.style.transition = '';
            resizeHandle.style.background = 'transparent';
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
        });
    }

    render();
})();
</script>

                quotes: [
                    { text: 'Need 50 real notes to test detector accuracy', source: 'Define eval corpus for insight engine', folder: 'Tasks', date: 'Oct 28' },

                quotes: [
                    { text: 'Common theme: everyone captures, nobody reviews', source: 'YC alumni Slack — 6 replies to my question about PKM tools', folder: 'People & Customers', date: 'Oct 10' }
                ],
                related: [
                    { type: 'insight', index: 2 },
                    { type: 'note', title: 'Weekly retro — Aug 3', folder: 'Journal', date: 'Today', text: 'Shipped vault design. Still no paying users. Need to talk to 3 more founders this week.' }
                ]
            },
            {
                tags: ['growth', 'mentorship'],
                title: 'You reference YC advice most when stuck on growth',
                date: '2 weeks ago',
                explanation: "Whenever a note mentions being stuck or unsure about growth, it's almost always followed within a day or two by a reference to YC advice, a YC alum conversation, or the application itself. That's a strong signal about which mentors and frameworks you actually trust when the path isn't obvious — worth leaning into deliberately, not just reactively.",
                quotes: [
                    { text: 'Deadline: Nov 12. Need 2-min demo video.', source: 'Apply to YC W25', folder: 'Tasks', date: 'Oct 30' },
                    { text: 'Offered to review onboarding flow, follow up in 2 weeks', source: 'Advisor intro — Maya R., ex-Notion PM', folder: 'People & Customers', date: 'Oct 12' }
                ],
                related: [
                    { type: 'insight', index: 3 },
                    { type: 'note', title: 'Book intro call with Maya R.', folder: 'Tasks', date: 'Oct 25', text: "She offered to review onboarding — don't let this slip." }
                ]
            },
            {
                tags: ['retention', 'trust'],
                title: 'Users ask for export before they ask for any feature',
                date: '1 month ago',
                explanation: 'In every early user conversation you\'ve logged, the first request — before any feature ask — is some form of "can I get my data out." That\'s usually a trust signal, not a feature request: people want to know they won\'t be locked in before they commit to using something daily. Shipping a simple export early may do more for adoption than any single feature on the roadmap.',
                quotes: [
                    { text: "Never ask if they'd buy. Ask about their life.", source: 'Book notes — The Mom Test, Rob Fitzpatrick', folder: 'Sources', date: 'Oct 18' },
                    { text: 'Transcript: uses voice memos but never reviews them', source: 'User interview — Alex K., solo founder', folder: 'People & Customers', date: 'Oct 15' }
                ],
                related: [
                    { type: 'insight', index: 0 },
                    { type: 'note', title: 'Interesting thread on vertical SaaS', folder: 'Recent', date: 'Yesterday', text: 'twitter.com' }
                ]
            }
        ];

        var listEl = document.getElementById('insight-list');
        var detailEl = document.getElementById('insight-detail');
        var countEl = document.getElementById('insight-count');
        var activeIndex = 0;

        countEl.textContent = INSIGHTS.length;

        var searchInput = document.getElementById('insight-search-input');
        var listEmptyEl = document.getElementById('insight-list-empty');

        function renderList() {
            var query = searchInput.value.trim().toLowerCase();
            listEl.innerHTML = '';
            var visibleCount = 0;

            INSIGHTS.forEach(function (insight, i) {
                if (query) {
                    var titleMatch = insight.title.toLowerCase().indexOf(query) !== -1;
                    var tagMatch = (insight.tags || []).some(function (t) { return t.toLowerCase().indexOf(query) !== -1; });
                    if (!titleMatch && !tagMatch) return;
                }
                visibleCount++;

                var isActive = i === activeIndex;
                var row = document.createElement('div');
                row.className = 'px-md py-sm mx-sm mb-xs rounded-lg cursor-pointer transition-colors';
                row.style.background = isActive ? '#D1FAE5' : 'transparent';
                row.style.borderLeft = isActive ? '3px solid #0D9F6E' : '3px solid transparent';
                row.onmouseover = function () { if (!isActive) row.style.background = '#EEF2F0'; };
                row.onmouseout = function () { if (!isActive) row.style.background = 'transparent'; };

                row.innerHTML =
                    '<div class="font-ui-semibold text-sm leading-snug mb-1" style="color:#1A2620;">' + insight.title + '</div>' +
                    '<div class="font-metadata-mono text-metadata-mono text-[11px]" style="color:#5C6F65;">' + insight.date + '</div>';

                row.addEventListener('click', function () {
                    activeIndex = i;
                    renderList();
                    renderDetail();
                    var twoPane = document.getElementById('insights-two-pane');
                    if (twoPane) twoPane.classList.add('mobile-show-detail');
                });

                listEl.appendChild(row);
            });

            listEmptyEl.classList.toggle('hidden', visibleCount > 0);
        }

        searchInput.addEventListener('input', renderList);

        var detailRenderedOnce = false;
        var detailRenderToken = 0;

        function renderDetail() {
            if (!detailRenderedOnce) {
                detailRenderedOnce = true;
                renderDetailNow();
                return;
            }
            // Switching insights — show a brief skeleton so the moment of
            // "AI is retrieving this insight" is visible, not instant.
            var token = ++detailRenderToken;
            detailEl.innerHTML =
                '<div class="mx-auto px-lg pt-lg pb-32" style="max-width:var(--content-width);">' +
                    '<div class="h-4 w-24 rounded-full animate-pulse mb-lg" style="background:#EEF2F0;"></div>' +
                    '<div class="h-7 w-full rounded-lg animate-pulse mb-2" style="background:#EEF2F0;"></div>' +
                    '<div class="h-7 w-2/3 rounded-lg animate-pulse mb-xl" style="background:#EEF2F0;"></div>' +
                    '<div class="rounded-xl p-md animate-pulse" style="background:#EEF2F0; height:100px;"></div>' +
                '</div>';
            setTimeout(function () {
                if (token !== detailRenderToken) return; // a newer switch superseded this one
                renderDetailNow();
            }, 260);
        }

        function renderDetailNow() {
            var insight = INSIGHTS[activeIndex];

            detailEl.innerHTML =
                '<div class="mx-auto px-lg pt-lg pb-32" style="max-width:var(--content-width);">' +
                    '<div class="mb-md flex items-center justify-between">' +
                        '<div class="flex items-center gap-1 flex-wrap" id="insight-tags-list"></div>' +
                        '<span class="font-metadata-mono text-metadata-mono text-sm shrink-0" style="color:#5C6F65;">' + insight.date + '</span>' +
                    '</div>' +
                    '<h2 class="font-display-sm mb-lg" style="font-size:28px; line-height:1.25; font-weight:700; color:#1A2620;">' + insight.title + '</h2>' +
                    '<div class="rounded-xl p-md flex gap-sm mb-xl" style="background:#EEF2F0;">' +
                        '<svg width="20" height="20" viewbox="8 12 64 44" fill="none" style="flex-shrink:0; margin-top:2px;">' +
                            '<path d="M12 34 Q40 16 68 34 Q40 52 12 34Z" stroke="#0D9F6E" stroke-linejoin="round" stroke-width="4"></path>' +
                            '<circle cx="40" cy="34" fill="#0D9F6E" r="10"></circle>' +
                        '</svg>' +
                        '<div>' +
                            '<p class="font-label-caps text-label-caps mb-1" style="color:#0D9F6E;">AI INSIGHT</p>' +
                            '<p class="text-sm leading-relaxed" style="color:#1A2620;">' + insight.explanation + '</p>' +
                        '</div>' +
                    '</div>' +
                    renderRatingHtml(insight) +
                    '<p class="font-label-caps text-label-caps mb-sm mt-xl" style="color:#5C6F65;">FROM YOUR NOTES</p>' +
                    '<div class="rounded-xl p-md" style="background:#FFFFFF; border:1px solid #D8E2DC;" id="insight-quotes-list"></div>' +
                    renderRelatedSection(insight) +
                    renderConversationHtml(insight) +
                '</div>';

            populateTags(insight);
            populateQuotes(insight);
            populateRelated(insight);
            wireRating(insight);
        }

        function renderRelatedSection(insight) {
            if (!insight.related || insight.related.length === 0) return '';
            return (
                '<div class="mt-xl">' +
                    '<p class="font-label-caps text-label-caps mb-sm" style="color:#5C6F65;">RELATED</p>' +
                    '<div class="flex gap-sm overflow-x-auto hide-scrollbar" id="insight-related-list"></div>' +
                '</div>'
            );
        }

        function populateTags(insight) {
            var wrap = document.getElementById('insight-tags-list');
            (insight.tags || []).forEach(function (tag) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'px-2 py-[2px] rounded text-[11px] font-ui-semibold transition-colors';
                btn.style.background = '#EEF2F0';
                btn.style.color = '#5C6F65';
                btn.textContent = tag;
                btn.onmouseover = function () { btn.style.background = '#D1FAE5'; btn.style.color = '#0D9F6E'; };
                btn.onmouseout = function () { btn.style.background = '#EEF2F0'; btn.style.color = '#5C6F65'; };
                btn.addEventListener('click', function () {
                    searchInput.value = tag;
                    renderList();
                });
                wrap.appendChild(btn);
            });
        }

        function populateRelated(insight) {
            var wrap = document.getElementById('insight-related-list');
            if (!wrap || !insight.related) return;

            insight.related.forEach(function (r) {
                var card = document.createElement('div');
                card.className = 'shrink-0 rounded-lg p-sm cursor-pointer transition-colors';
                card.style.width = '200px';
                card.style.background = '#FFFFFF';
                card.style.border = '1px solid #D8E2DC';
                card.onmouseover = function () { card.style.background = '#EEF2F0'; };
                card.onmouseout = function () { card.style.background = '#FFFFFF'; };

                if (r.type === 'insight') {
                    var target = INSIGHTS[r.index];
                    card.innerHTML =
                        '<div class="flex items-center gap-1 mb-1">' +
                            '<svg height="12" viewbox="8 12 64 44" width="12" fill="none"><path d="M12 34 Q40 16 68 34 Q40 52 12 34Z" stroke="#0D9F6E" stroke-linejoin="round" stroke-width="6"></path></svg>' +
                            '<span class="text-[10px] font-ui-semibold uppercase tracking-wider" style="color:#0D9F6E;">Insight</span>' +
                        '</div>' +
                        '<div class="text-xs font-ui-semibold leading-snug" style="color:#1A2620;">' + target.title + '</div>';
                    card.addEventListener('click', function () {
                        activeIndex = r.index;
                        renderList();
                        renderDetail();
                        detailEl.scrollTop = 0;
                    });
                } else {
                    card.innerHTML =
                        '<div class="flex items-center gap-1 mb-1">' +
                            '<span class="material-symbols-outlined text-[12px]" style="color:#5C6F65;">description</span>' +
                            '<span class="text-[10px] font-ui-semibold uppercase tracking-wider" style="color:#5C6F65;">' + r.folder + '</span>' +
                        '</div>' +
                        '<div class="text-xs font-ui-semibold leading-snug" style="color:#1A2620;">' + r.title + '</div>';
                    card.addEventListener('click', function () {
                        window.openNotePreview({ source: r.title, folder: r.folder, date: r.date, text: r.text });
                    });
                }

                wrap.appendChild(card);
            });
        }

        function populateQuotes(insight) {
            var container = document.getElementById('insight-quotes-list');
            insight.quotes.forEach(function (q, i) {
                var wrap = document.createElement('div');
                if (i > 0) {
                    var divider = document.createElement('div');
                    divider.className = 'border-t my-md';
                    divider.style.borderColor = '#D8E2DC';
                    container.appendChild(divider);
                }
                wrap.innerHTML =
                    '<p class="text-sm italic leading-relaxed" style="color:#1A2620;">&ldquo;' + q.text + '&rdquo;</p>' +
                    '<button class="flex items-center gap-2 mt-2 group" type="button">' +
                        '<span class="material-symbols-outlined text-[14px]" style="color:#5C6F65;">description</span>' +
                        '<span class="text-xs group-hover:underline" style="color:#5C6F65;">' + q.source + ' · ' + q.folder + ' · ' + q.date + '</span>' +
                    '</button>';
                wrap.querySelector('button').addEventListener('click', function () {
                    window.openNotePreview(q);
                });
                container.appendChild(wrap);
            });
        }

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function renderConversationHtml(insight) {
            var messages = insight.messages || [];
            if (messages.length === 0) return '';

            var bubblesHtml = messages.map(function (m) {
                var safeText = escapeHtml(m.text);
                if (m.role === 'user') {
                    return (
                        '<div class="flex justify-end mb-sm">' +
                            '<div class="rounded-xl px-3 py-2 text-sm leading-relaxed" style="max-width:75%; background:#0D9F6E; color:#FFFFFF;">' + safeText + '</div>' +
                        '</div>'
                    );
                }
                return (
                    '<div class="flex justify-start mb-sm">' +
                        '<div class="rounded-xl px-3 py-2 text-sm leading-relaxed" style="max-width:75%; background:#EEF2F0; color:#1A2620;">' + safeText + '</div>' +
                    '</div>'
                );
            }).join('');

            return (
                '<div class="mt-xl">' +
                    '<p class="font-label-caps text-label-caps mb-sm" style="color:#5C6F65;">CONVERSATION</p>' +
                    '<div>' + bubblesHtml + '</div>' +
                '</div>'
            );
        }

        function renderRatingHtml(insight) {
            if (insight.feedbackSubmitted) {
                return (
                    '<div class="mt-xl pt-lg border-t flex items-center gap-2" style="border-color:#D8E2DC;">' +
                        '<span class="material-symbols-outlined text-[18px]" style="color:#0D9F6E;">check_circle</span>' +
                        '<span class="text-sm" style="color:#5C6F65;">Thanks for the feedback.</span>' +
                    '</div>'
                );
            }

            var currentRating = insight.rating || 0;
            var starsHtml = '';
            for (var s = 1; s <= 5; s++) {
                var filled = s <= currentRating;
                starsHtml +=
                    '<button aria-label="' + s + ' star' + (s > 1 ? 's' : '') + '" class="w-9 h-9 flex items-center justify-center rounded-lg transition-colors insight-rating-star" data-value="' + s + '" style="color:' + (filled ? '#0D9F6E' : '#D8E2DC') + ';" type="button">' +
                        '<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: \'FILL\' ' + (filled ? '1' : '0') + ';">star</span>' +
                    '</button>';
            }

            var showFeedbackBox = currentRating > 0;

            return (
                '<div class="mt-xl pt-lg border-t" style="border-color:#D8E2DC;">' +
                    '<p class="font-label-caps text-label-caps mb-sm" style="color:#5C6F65;">WAS THIS INSIGHT USEFUL?</p>' +
                    '<div class="flex items-center gap-1" id="insight-rating-stars">' + starsHtml + '</div>' +
                    '<div class="mt-sm" id="insight-rating-feedback-wrap" style="display:' + (showFeedbackBox ? '' : 'none') + ';">' +

                    btn.style.color = filled ? '#0D9F6E' : '#D8E2DC';

                btn.addEventListener('mouseenter', function () { paintStars(val); });

<script>
    (function () {
        var pane = document.getElementById('insights-list-pane');
        var handle = document.getElementById('insights-list-resize-handle');
        if (!pane || !handle) return;

        var WIDTH_KEY = 'flare-insights-list-width';
        var MIN_WIDTH = 220;
        var MAX_WIDTH = 440;
        var DEFAULT_WIDTH = 280;

        function isDesktop() {
            return window.matchMedia('(min-width: 768px)').matches;
        }

        var saved = parseInt(localStorage.getItem(WIDTH_KEY), 10);
        var currentWidth = (saved >= MIN_WIDTH && saved <= MAX_WIDTH) ? saved : DEFAULT_WIDTH;

        function render() {
            pane.style.width = isDesktop() ? currentWidth + 'px' : '';
        }

        function setWidth(px) {
            currentWidth = Math.max(MIN_WIDTH, Math.min(MAX_WIDTH, px));
            localStorage.setItem(WIDTH_KEY, String(currentWidth));
            render();
        }

        window.addEventListener('resize', render);

        var dragging = false;
        var startX = 0;
        var startWidth = 0;

        handle.addEventListener('mouseover', function () {
            handle.style.background = 'rgba(13,159,110,0.3)';
        });
        handle.addEventListener('mouseout', function () {
            if (!dragging) handle.style.background = 'transparent';
        });

        handle.addEventListener('mousedown', function (e) {
            if (!isDesktop()) return;
            dragging = true;
            startX = e.clientX;
            startWidth = currentWidth;
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
            e.preventDefault();
        });

        document.addEventListener('mousemove', function (e) {
            if (!dragging) return;
            setWidth(startWidth + (e.clientX - startX));
        });

        document.addEventListener('mouseup', function () {
            if (!dragging) return;
            dragging = false;
            handle.style.background = 'transparent';
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
        });

        render();
    })();
</script>

<script>
(function () {
    var ICONS = { error: 'error', success: 'check_circle' };
    var STYLES = {
        error: { bg: '#FEF2F2', border: '#FECACA', text: '#B91C1C', icon: '#DC2626' },
        success: { bg: '#F0FDF9', border: 'rgba(13,159,110,0.25)', text: '#0D9F6E', icon: '#0D9F6E' }
    };

    window.flareToast = function (message, type) {
        var stack = document.getElementById('flare-toast-stack');
        if (!stack) return;
        type = (type === 'success') ? 'success' : 'error';
        var style = STYLES[type];

        var toast = document.createElement('div');
        toast.className = 'flex items-center gap-2 rounded-lg pointer-events-auto shadow-lg';
        toast.style.cssText =
            'background:' + style.bg + '; border:1px solid ' + style.border + '; color:' + style.text + ';' +
            'padding:10px 16px; font-size:13px; font-weight:600; opacity:0; transform:translateY(8px); transition:opacity .18s ease-out, transform .18s ease-out; max-width:min(90vw,420px);';
        toast.innerHTML =
            '<span class="material-symbols-outlined text-[18px]" style="color:' + style.icon + ';">' + ICONS[type] + '</span>' +
            '<span>' + message + '</span>';
        stack.appendChild(toast);

        requestAnimationFrame(function () {
            toast.style.opacity = '1';
            toast.style.transform = 'translateY(0)';
        });

        setTimeout(function () {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(8px)';
            setTimeout(function () { toast.remove(); }, 200);
        }, 3200);
    };
})();
</script>
