<script>
(function () {
    var sidebar = document.getElementById('sidebar');
    var mainEl = document.getElementById('main-content');
    var toggleBtn = document.getElementById('sidebar-toggle');
    var toggleIcon = document.getElementById('sidebar-toggle-icon');
    var resizeHandle = document.getElementById('sidebar-resize-handle');

    var COLLAPSED_KEY = 'flare-sidebar-collapsed';
    var WIDTH_KEY = 'flare-sidebar-width';
    var DEFAULT_WIDTH = 200;
    var MIN_WIDTH = 64;
    var MAX_WIDTH = 240;
    var ICON_ONLY_THRESHOLD = 100;

    var savedWidth = parseInt(localStorage.getItem(WIDTH_KEY), 10);
    var currentWidth = (savedWidth >= MIN_WIDTH && savedWidth <= MAX_WIDTH) ? savedWidth : DEFAULT_WIDTH;
    var collapsed = localStorage.getItem(COLLAPSED_KEY) === '1';

    function isDesktop() {
        return window.matchMedia('(min-width: 768px)').matches;
    }

    function applyIconOnly(iconOnly) {
        var labels = sidebar.querySelectorAll('.nav-label, .sidebar-brand-label, .sidebar-profile-label');
        labels.forEach(function (el) { el.style.display = iconOnly ? 'none' : ''; });

        // Every row (brand, nav list, nav links, account row) has a different
        // horizontal padding by default, so centering each independently
        // leaves their icons at different x positions. Zeroing all of them
        // out and centering within the full-width rail makes every icon —
        // logo included — line up on the same vertical axis.
        var rows = sidebar.querySelectorAll('.nav-link, #account-menu-trigger, .sidebar-brand-row, .sidebar-nav-list, .sidebar-footer-wrap');
        rows.forEach(function (el) {
            el.style.justifyContent = iconOnly ? 'center' : '';
            el.style.paddingLeft = iconOnly ? '0px' : '';
            el.style.paddingRight = iconOnly ? '0px' : '';
        });

        // Push the brand row down a bit so it doesn't crowd the top edge
        // of the rail once it's icon-only.
        var brandRow = sidebar.querySelector('.sidebar-brand-row');
        if (brandRow) {
            brandRow.style.marginTop = iconOnly ? '12px' : '';
        }

        // The brand logo is sized for a wide sidebar (64px) — at the
        // minimum rail width (64px) it would overflow its own row edge to
        // edge. Shrink it to 1.5x the 20px nav icons (30px) so it fits
        // with breathing room while still reading as a "brand mark"
        // rather than just another nav icon, instead of getting clipped
        // by the rail's overflow:hidden.
        var logoImg = sidebar.querySelector('.sidebar-logo-img');
        if (logoImg) {
            logoImg.style.width = iconOnly ? '30px' : '';
            logoImg.style.height = iconOnly ? '30px' : '';
        }
    }

    function render() {
        var width = collapsed ? 0 : currentWidth;
        sidebar.style.width = width + 'px';
        sidebar.style.opacity = collapsed ? '0' : '1';
        sidebar.style.borderRightWidth = collapsed ? '0px' : '1.5px';
        mainEl.style.marginLeft = (isDesktop() && !collapsed) ? currentWidth + 'px' : '0px';
        toggleIcon.textContent = collapsed ? 'left_panel_open' : 'left_panel_close';
        applyIconOnly(!collapsed && currentWidth <= ICON_ONLY_THRESHOLD);
    }

    function setCollapsed(value) {
        collapsed = value;
        localStorage.setItem(COLLAPSED_KEY, collapsed ? '1' : '0');
        render();
    }

    function setWidth(px) {
        currentWidth = Math.max(MIN_WIDTH, Math.min(MAX_WIDTH, px));
        localStorage.setItem(WIDTH_KEY, String(currentWidth));
        render();
    }

    toggleBtn.addEventListener('click', function () { setCollapsed(!collapsed); });
    window.addEventListener('resize', render);

    if (resizeHandle) {
        var dragging = false;
        var startX = 0;
        var startWidth = 0;

        resizeHandle.addEventListener('mouseover', function () {
            resizeHandle.style.background = 'rgba(13,159,110,0.3)';
        });
        resizeHandle.addEventListener('mouseout', function () {
            if (!dragging) resizeHandle.style.background = 'transparent';
        });

        resizeHandle.addEventListener('mousedown', function (e) {
            if (collapsed) return;
            dragging = true;
            startX = e.clientX;
            startWidth = currentWidth;
            sidebar.style.transition = 'none';
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
            e.preventDefault();
        });

        document.addEventListener('mousemove', function (e) {
            if (!dragging) return;
            setWidth(startWidth + (e.clientX - startX));
        });

        document.addEventListener('mouseup', function () {
            if (!dragging) return;
            dragging = false;
            sidebar.style.transition = '';
            resizeHandle.style.background = 'transparent';
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
        });
    }

    render();
})();
</script>
<script>

    (function () {
        var SECTIONS = [
            { id: 'general', label: 'General', icon: 'tune' },
            { id: 'folders', label: 'Folders', icon: 'folder' },
            { id: 'insights', label: 'Insights', icon: 'insights' },
            { id: 'integrations', label: 'Integrations', icon: 'extension' },
            { id: 'notifications', label: 'Notifications', icon: 'notifications' },
            { id: 'export', label: 'Export', icon: 'download' },
            { id: 'members', label: 'Members', icon: 'group' },
            { id: 'danger', label: 'Danger Zone', icon: 'warning' }
        ];

        var state = {
            activeSection: 'general',
            workspaceName: 'My Workspace',
            language: 'auto',
            folders: [
                { name: 'Ideas', description: 'Early-stage product and feature ideas, not yet validated.' },
                { name: 'Research', description: 'Market research, competitor analysis, pricing benchmarks.' },
                { name: 'Sources', description: 'External articles, books, and links worth remembering.' },
                { name: 'People & Customers', description: 'Interview notes, calls, and conversations with real people.' },
                { name: 'Journal', description: 'Personal reflections, retros, and day-to-day decisions.' },
                { name: 'Tasks', description: 'Things to do, with deadlines and blockers.' }
            ],
            insightsInstructions: '',
            schedule: 'daily',
            scheduleDay: 'Monday',
            notion: { connected: false },
            gdrive: { connected: false },
            digestOn: true,
            digestDay: 'Monday',
            digestTime: '09:00',
            notifyNewInsight: true,
            notifyProcessing: false,
            membersNotified: false
        };

        var menuEl = document.getElementById('settings-menu');
        var contentEl = document.getElementById('settings-content');

        function renderMenu() {
            menuEl.innerHTML = '';
            SECTIONS.forEach(function (s) {
                var isActive = s.id === state.activeSection;
                var li = document.createElement('li');
                var a = document.createElement('a');
                a.href = '#';
                a.className = 'flex items-center gap-sm px-sm py-sm rounded-lg transition-colors active:scale-95 duration-150';
                a.style.color = isActive ? '#0D9F6E' : '#3d4a42';
                a.style.fontWeight = isActive ? '700' : '600';
                a.style.background = isActive ? '#D1FAE5' : 'transparent';
                a.onmouseover = function () { if (!isActive) a.style.background = '#EEF2F0'; };
                a.onmouseout = function () { if (!isActive) a.style.background = 'transparent'; };
                a.innerHTML =
                    '<span class="material-symbols-outlined text-[18px]">' + s.icon + '</span>' +
                    '<span>' + s.label + '</span>';
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    state.activeSection = s.id;
                    renderMenu();
                    renderContent();
                    var twoPane = document.getElementById('settings-two-pane');
                    if (twoPane) twoPane.classList.add('mobile-show-content');
                });
                li.appendChild(a);
                menuEl.appendChild(li);
            });
        }

        function wrapSection(innerHtml) {
            return '<div class="mx-auto px-lg pt-lg pb-32" style="max-width:var(--content-width);">' + innerHtml + '</div>';
        }

        function sectionHeader(title, desc) {
            return (
                '<h2 class="font-display-sm mb-1" style="font-size:22px; font-weight:800; color:#1A2620;">' + title + '</h2>' +
                (desc ? '<p class="text-sm mb-lg" style="color:#5C6F65;">' + desc + '</p>' : '<div class="mb-lg"></div>')
            );
        }

        // ---------- Section renderers ----------

        function renderGeneral() {
            return wrapSection(
                sectionHeader('General', null) +
                '<div class="mb-xl">' +
                    '<label class="block text-xs font-ui-semibold mb-1" style="color:#5C6F65;">Workspace name</label>' +
                    '<div class="flex items-center gap-2">' +
                        '<input class="flex-1 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 transition-all" id="settings-workspace-name" style="background:#EEF2F0; border:1px solid #D8E2DC; color:#1A2620;" type="text" value="' + state.workspaceName + '">' +
                        '<button class="text-white text-sm font-ui-semibold px-4 py-2 rounded-lg transition-colors active:scale-95 shrink-0" id="settings-workspace-name-save" onmouseover="this.style.background=\'#0b8a5f\'" onmouseout="this.style.background=\'#0D9F6E\'" style="background:#0D9F6E;" type="button">Save</button>' +
                    '</div>' +
                '</div>' +
                '<div>' +
                    '<label class="block text-xs font-ui-semibold mb-1" style="color:#5C6F65;">Insights language</label>' +
                    '<select class="px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 transition-all" id="settings-language" style="background:#EEF2F0; border:1px solid #D8E2DC; color:#1A2620;">' +
                        '<option value="auto"' + (state.language === 'auto' ? ' selected' : '') + '>Auto (detect from notes)</option>' +
                        '<option value="en"' + (state.language === 'en' ? ' selected' : '') + '>English</option>' +
                        '<option value="ru"' + (state.language === 'ru' ? ' selected' : '') + '>Russian</option>' +
                    '</select>' +
                '</div>'
            );
        }

        function wireGeneral() {
            var nameInput = document.getElementById('settings-workspace-name');
            var saveBtn = document.getElementById('settings-workspace-name-save');
            saveBtn.addEventListener('click', function () {
                state.workspaceName = nameInput.value.trim() || 'My Workspace';
                document.getElementById('settings-workspace-label').textContent = state.workspaceName;
                saveBtn.textContent = 'Saved';
                setTimeout(function () { saveBtn.textContent = 'Save'; }, 1200);
            });

            document.getElementById('settings-language').addEventListener('change', function (e) {
                state.language = e.target.value;
            });
        }

        function renderFolders() {
            var rowsHtml = state.folders.map(function (folder, i) {
                return (
                    '<div class="flex items-start justify-between gap-sm p-sm rounded-lg cursor-pointer transition-colors settings-folder-row" data-index="' + i + '">' +
                        '<div class="flex items-start gap-sm min-w-0 flex-1">' +
                            '<div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style="background:#EEF2F0;">' +
                                '<span class="material-symbols-outlined text-[18px]" style="color:#5C6F65;">folder</span>' +
                            '</div>' +
                            '<div class="min-w-0 break-words">' +
                                '<div class="text-sm font-ui-semibold" style="color:#1A2620; overflow-wrap:break-word;">' + folder.name + '</div>' +
                                '<div class="text-xs" style="color:#5C6F65; overflow-wrap:break-word;">' + (folder.description || 'No AI description yet') + '</div>' +
                            '</div>' +
                        '</div>' +
                        '<button aria-label="Delete folder" class="w-8 h-8 shrink-0 flex items-center justify-center rounded-lg transition-colors settings-folder-delete" style="color:#5C6F65;" type="button">' +
                            '<span class="material-symbols-outlined text-[18px]">delete</span>' +
                        '</button>' +
                    '</div>'
                );
            }).join('');

            return wrapSection(
                sectionHeader('Folders', 'Manage the folders your notes get organized into. Click a folder to rename it or write AI instructions for it.') +
                '<div class="rounded-xl p-sm" style="background:#FFFFFF; border:1px solid #D8E2DC;" id="settings-folder-list">' + rowsHtml + '</div>' +
                '<button class="mt-sm flex items-center gap-1 text-sm font-ui-semibold px-3 py-2 rounded-lg transition-colors" id="settings-add-folder" onmouseover="this.style.background=\'#EEF2F0\'" onmouseout="this.style.background=\'transparent\'" style="color:#0D9F6E;" type="button">' +
                    '<span class="material-symbols-outlined text-[18px]">add</span> Add folder' +
                '</button>'
            );
        }

        function wireFolders() {
            var list = document.getElementById('settings-folder-list');

            function showDeleteConfirm(row, index) {
                var folder = state.folders[index];
                var original = row.innerHTML;
                row.setAttribute('data-confirming', '1');

                row.innerHTML =
                    '<div class="flex items-center justify-between gap-sm w-full">' +
                        '<span class="text-sm" style="color:#1A2620;">Delete <strong>' + folder.name + '</strong>? This can\'t be undone.</span>' +
                        '<div class="flex items-center gap-2 shrink-0">' +
                            '<button class="text-sm font-ui-semibold px-3 py-1.5 rounded-lg transition-colors settings-folder-delete-cancel" style="background:#FFFFFF; border:1.5px solid #D8E2DC; color:#1A2620;" type="button">Cancel</button>' +
                            '<button class="text-sm font-ui-semibold px-3 py-1.5 rounded-lg transition-colors text-white settings-folder-delete-confirm" style="background:#ba1a1a;" type="button">Delete</button>' +
                        '</div>' +
                    '</div>';

                row.querySelector('.settings-folder-delete-cancel').addEventListener('click', function (e) {
                    e.stopPropagation();
                    row.innerHTML = original;
                    row.removeAttribute('data-confirming');
                    wireRowButtons(row);
                });
                row.querySelector('.settings-folder-delete-confirm').addEventListener('click', function (e) {
                    e.stopPropagation();
                    state.folders.splice(index, 1);
                    renderContent();
                });
            }

            function wireRowButtons(row) {
                var delBtn = row.querySelector('.settings-folder-delete');
                delBtn.onmouseover = function () { delBtn.style.color = '#ba1a1a'; };
                delBtn.onmouseout = function () { delBtn.style.color = '#5C6F65'; };
                delBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    var index = parseInt(row.getAttribute('data-index'), 10);
                    showDeleteConfirm(row, index);
                });
            }

            function wireRow(row) {
                wireRowButtons(row);
                row.addEventListener('click', function () {
                    if (row.getAttribute('data-confirming') === '1') return;
                    var index = parseInt(row.getAttribute('data-index'), 10);
                    openFolderEditor(index);
                });
            }

            list.querySelectorAll('.settings-folder-row').forEach(wireRow);

            document.getElementById('settings-add-folder').addEventListener('click', function () {
                openFolderEditor(null);
            });
        }

        function renderInsights() {
            var scheduleOptions = [
                { id: 'daily', label: 'Daily' },
                { id: 'weekly', label: 'Weekly' },
                { id: 'threshold', label: 'When 10+ new notes added' }
            ];
            var chipsHtml = scheduleOptions.map(function (o) {
                var isActive = o.id === state.schedule;
                return (
                    '<button class="px-4 py-1.5 rounded-full font-ui-semibold text-sm whitespace-nowrap transition-colors settings-schedule-chip" data-schedule="' + o.id + '" style="background:' + (isActive ? '#0D9F6E' : '#FFFFFF') + '; color:' + (isActive ? '#FFFFFF' : '#5C6F65') + '; border:1px solid ' + (isActive ? '#0D9F6E' : '#D8E2DC') + ';" type="button">' + o.label + '</button>'
                );
            }).join('');

            var days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
            var dayOptionsHtml = days.map(function (d) {
                return '<option value="' + d + '"' + (d === state.scheduleDay ? ' selected' : '') + '>' + d + '</option>';
            }).join('');

            return wrapSection(
                sectionHeader('Insights', 'Tell the AI what to focus on when generating insights for this workspace.') +
                '<textarea class="w-full rounded-lg text-sm p-3 focus:outline-none focus:ring-2 transition-all mb-sm" id="settings-insights-instructions" placeholder="e.g. Focus more on customer feedback. Highlight recurring blockers. Prioritize insights about growth and retention." rows="6" style="background:#EEF2F0; border:1px solid #D8E2DC; color:#1A2620; resize:none;">' + state.insightsInstructions + '</textarea>' +
                '<button class="text-white text-sm font-ui-semibold px-4 py-2 rounded-lg transition-colors active:scale-95" id="settings-insights-save" onmouseover="this.style.background=\'#0b8a5f\'" onmouseout="this.style.background=\'#0D9F6E\'" style="background:#0D9F6E;" type="button">Save</button>' +
                '<div class="border-t my-xl" style="border-color:#D8E2DC;"></div>' +
                '<p class="font-label-caps text-label-caps mb-sm" style="color:#5C6F65;">GENERATION SCHEDULE</p>' +
                '<div class="flex items-center gap-2 flex-wrap" id="settings-schedule-chips">' + chipsHtml + '</div>' +
                '<div class="mt-sm" id="settings-schedule-day-wrap" style="display:' + (state.schedule === 'weekly' ? '' : 'none') + ';">' +
                    '<select class="px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 transition-all" id="settings-schedule-day" style="background:#EEF2F0; border:1px solid #D8E2DC; color:#1A2620;">' + dayOptionsHtml + '</select>' +
                '</div>'
            );
        }

        function wireInsights() {
            var textarea = document.getElementById('settings-insights-instructions');
            var saveBtn = document.getElementById('settings-insights-save');
            saveBtn.addEventListener('click', function () {
                state.insightsInstructions = textarea.value;
                saveBtn.textContent = 'Saved';
                setTimeout(function () { saveBtn.textContent = 'Save'; }, 1200);
            });

            var dayWrap = document.getElementById('settings-schedule-day-wrap');
            document.querySelectorAll('.settings-schedule-chip').forEach(function (chip) {
                chip.addEventListener('click', function () {
                    state.schedule = chip.getAttribute('data-schedule');
                    dayWrap.style.display = state.schedule === 'weekly' ? '' : 'none';
                    document.querySelectorAll('.settings-schedule-chip').forEach(function (c) {
                        var active = c === chip;
                        c.style.background = active ? '#0D9F6E' : '#FFFFFF';
                        c.style.color = active ? '#FFFFFF' : '#5C6F65';
                        c.style.border = '1px solid ' + (active ? '#0D9F6E' : '#D8E2DC');
                    });
                });
            });

            var dayInput = document.getElementById('settings-schedule-day');
            if (dayInput) dayInput.addEventListener('change', function (e) { state.scheduleDay = e.target.value; });
        }

        function integrationCard(opts) {
            var statusHtml = opts.connected
                ? (
                    '<span class="flex items-center gap-1 text-xs" style="color:#0D9F6E;">' +
                        '<span class="w-1.5 h-1.5 rounded-full" style="background:#0D9F6E;"></span>' +
                        'Connected as ' + state.workspaceName +
                    '</span>'
                  )
                : '<span class="text-xs" style="color:#5C6F65;">Not connected</span>';

            var btnHtml = opts.connected
                ? '<button class="text-sm font-ui-semibold px-4 py-2 rounded-lg transition-colors settings-integration-btn" data-key="' + opts.key + '" style="background:#FFFFFF; border:1.5px solid #D8E2DC; color:#1A2620;" type="button">Disconnect</button>'
                : '<button class="text-white text-sm font-ui-semibold px-4 py-2 rounded-lg transition-colors settings-integration-btn" data-key="' + opts.key + '" onmouseover="this.style.background=\'#0b8a5f\'" onmouseout="this.style.background=\'#0D9F6E\'" style="background:#0D9F6E;" type="button">Connect</button>';

            return (
                '<div class="rounded-xl p-md flex items-center justify-between gap-md" style="background:#FFFFFF; border:1px solid #D8E2DC;">' +
                    '<div class="flex items-center gap-sm min-w-0">' +
                        '<div class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0 text-white font-ui-semibold" style="background:' + opts.iconBg + ';">' + opts.iconLabel + '</div>' +
                        '<div class="min-w-0">' +
                            '<p class="text-sm font-ui-semibold" style="color:#1A2620;">' + opts.title + '</p>' +
                            '<p class="text-xs" style="color:#5C6F65;">' + opts.desc + '</p>' +
                            '<div class="mt-1">' + statusHtml + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="shrink-0">' + btnHtml + '</div>' +
                '</div>'
            );
        }

        function renderIntegrations() {
            return wrapSection(
                sectionHeader('Integrations', 'Bring notes in from where you already write.') +
                '<div class="flex flex-col gap-sm">' +
                    integrationCard({ key: 'notion', title: 'Notion', desc: 'Import pages and databases', iconBg: '#000000', iconLabel: 'N', connected: state.notion.connected }) +
                    integrationCard({ key: 'gdrive', title: 'Google Drive', desc: 'Import Docs and files', iconBg: '#0D9F6E', iconLabel: 'G', connected: state.gdrive.connected }) +
                    '<div class="rounded-xl p-md flex items-center justify-between gap-md" style="background:#FFFFFF; border:1px solid #D8E2DC;">' +
                        '<div class="flex items-center gap-sm min-w-0">' +
                            '<div class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0" style="background:#EEF2F0;">' +
                                '<span class="material-symbols-outlined text-[20px]" style="color:#5C6F65;">folder_zip</span>' +
                            '</div>' +
                            '<div class="min-w-0">' +
                                '<p class="text-sm font-ui-semibold" style="color:#1A2620;">Markdown folder</p>' +
                                '<p class="text-xs" style="color:#5C6F65;" id="settings-md-status">Import from local folder or .zip</p>' +
                            '</div>' +
                        '</div>' +
                        '<div class="shrink-0">' +
                            '<input class="hidden" id="settings-md-file-input" multiple type="file">' +
                            '<button class="text-sm font-ui-semibold px-4 py-2 rounded-lg transition-colors" id="settings-md-import-btn" style="background:#FFFFFF; border:1.5px solid #D8E2DC; color:#1A2620;" type="button">Import files</button>' +
                        '</div>' +
                    '</div>' +
                '</div>'
            );
        }

        function wireIntegrations() {
            document.querySelectorAll('.settings-integration-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var key = btn.getAttribute('data-key');
                    state[key].connected = !state[key].connected;
                    renderContent();
                });
            });

            var fileInput = document.getElementById('settings-md-file-input');
            var importBtn = document.getElementById('settings-md-import-btn');
            var status = document.getElementById('settings-md-status');
            importBtn.addEventListener('click', function () { fileInput.click(); });
            fileInput.addEventListener('change', function () {
                var count = fileInput.files.length;
                status.textContent = count > 0 ? count + ' file' + (count === 1 ? '' : 's') + ' selected (demo, not uploaded)' : 'Import from local folder or .zip';
            });
        }

        function toggleRow(opts) {
            return (
                '<div class="flex items-center justify-between py-sm">' +
                    '<div>' +
                        '<p class="text-sm font-ui-semibold" style="color:#1A2620;">' + opts.label + '</p>' +
                        (opts.desc ? '<p class="text-xs" style="color:#5C6F65;">' + opts.desc + '</p>' : '') +
                    '</div>' +
                    '<button aria-pressed="' + opts.on + '" class="shrink-0 relative inline-block rounded-full transition-colors settings-toggle" data-key="' + opts.key + '" style="width:36px; height:20px; background:' + (opts.on ? '#0D9F6E' : '#D8E2DC') + ';" type="button">' +
                        '<span class="absolute top-[2px] left-[2px] w-4 h-4 rounded-full bg-white transition-transform" style="transform:' + (opts.on ? 'translateX(16px)' : '') + '; box-shadow:0 1px 2px rgba(0,0,0,0.25);"></span>' +
                    '</button>' +
                '</div>'
            );
        }

        function renderNotifications() {
            var days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
            var times = ['08:00', '09:00', '10:00', '12:00'];
            var dayOptionsHtml = days.map(function (d) { return '<option value="' + d + '"' + (d === state.digestDay ? ' selected' : '') + '>' + d + '</option>'; }).join('');
            var timeOptionsHtml = times.map(function (t) { return '<option value="' + t + '"' + (t === state.digestTime ? ' selected' : '') + '>' + t + '</option>'; }).join('');

            return wrapSection(
                sectionHeader('Notifications', null) +
                '<div class="divide-y" style="border-color:#D8E2DC;">' +
                    toggleRow({ key: 'digestOn', label: 'Weekly email digest', desc: 'A summary of new insights, sent once a week.', on: state.digestOn }) +
                    '<div id="settings-digest-options" class="pb-sm" style="display:' + (state.digestOn ? '' : 'none') + ';">' +
                        '<div class="flex items-center gap-2 pl-0">' +
                            '<select class="px-3 py-1.5 rounded-lg text-sm focus:outline-none focus:ring-2 transition-all" id="settings-digest-day" style="background:#EEF2F0; border:1px solid #D8E2DC; color:#1A2620;">' + dayOptionsHtml + '</select>' +
                            '<select class="px-3 py-1.5 rounded-lg text-sm focus:outline-none focus:ring-2 transition-all" id="settings-digest-time" style="background:#EEF2F0; border:1px solid #D8E2DC; color:#1A2620;">' + timeOptionsHtml + '</select>' +
                        '</div>' +
                    '</div>' +
                    toggleRow({ key: 'notifyNewInsight', label: 'Notify when new insight is ready', desc: null, on: state.notifyNewInsight }) +
                    toggleRow({ key: 'notifyProcessing', label: 'Notify when notes finish processing', desc: null, on: state.notifyProcessing }) +
                '</div>'
            );
        }

        function wireNotifications() {
            var digestOptions = document.getElementById('settings-digest-options');

            document.querySelectorAll('.settings-toggle').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var key = btn.getAttribute('data-key');
                    state[key] = !state[key];
                    if (key === 'digestOn') {
                        digestOptions.style.display = state.digestOn ? '' : 'none';
                    }
                    btn.style.background = state[key] ? '#0D9F6E' : '#D8E2DC';
                    btn.querySelector('span').style.transform = state[key] ? 'translateX(16px)' : '';
                });
            });

            var dayInput = document.getElementById('settings-digest-day');
            var timeInput = document.getElementById('settings-digest-time');
            if (dayInput) dayInput.addEventListener('change', function (e) { state.digestDay = e.target.value; });
            if (timeInput) timeInput.addEventListener('change', function (e) { state.digestTime = e.target.value; });
        }

        function renderExport() {

<div class="fixed left-1/2 z-[100] flex flex-col items-center gap-2 pointer-events-none bottom-20 md:bottom-6" id="flare-toast-stack" style="transform:translateX(-50%);"></div>

<!-- TOAST-JS -->
<script>
(function () {
    var ICONS = { error: 'error', success: 'check_circle' };
    var STYLES = {
        error: { bg: '#FEF2F2', border: '#FECACA', text: '#B91C1C', icon: '#DC2626' },
        success: { bg: '#F0FDF9', border: 'rgba(13,159,110,0.25)', text: '#0D9F6E', icon: '#0D9F6E' }
    };

    window.flareToast = function (message, type) {
        var stack = document.getElementById('flare-toast-stack');
        if (!stack) return;
        type = (type === 'success') ? 'success' : 'error';
        var style = STYLES[type];

        var toast = document.createElement('div');
        toast.className = 'flex items-center gap-2 rounded-lg pointer-events-auto shadow-lg';
        toast.style.cssText =
            'background:' + style.bg + '; border:1px solid ' + style.border + '; color:' + style.text + ';' +
            'padding:10px 16px; font-size:13px; font-weight:600; opacity:0; transform:translateY(8px); transition:opacity .18s ease-out, transform .18s ease-out; max-width:min(90vw,420px);';
        toast.innerHTML =
            '<span class="material-symbols-outlined text-[18px]" style="color:' + style.icon + ';">' + ICONS[type] + '</span>' +
            '<span>' + message + '</span>';
        stack.appendChild(toast);

        requestAnimationFrame(function () {
            toast.style.opacity = '1';
            toast.style.transform = 'translateY(0)';
        });

        setTimeout(function () {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(8px)';
            setTimeout(function () { toast.remove(); }, 200);
        }, 3200);
    };
})();
</script>
